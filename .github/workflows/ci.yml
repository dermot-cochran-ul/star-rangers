name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (Eleventy dry run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags. scripts/check-changelog.js uses git tags as
          # its oracle for which releases must still have a CHANGELOG section,
          # and the default shallow checkout fetches none - so the check would
          # degrade to structure-only here, silently, in the one place that
          # gates every device. A tablet cannot run npm test; CI is what
          # actually enforces this.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  shellcheck:
    name: ShellCheck deploy scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck --severity=warning scripts/cpanel-deploy.sh scripts/deploy-lib.sh scripts/mail-lib.sh scripts/ensure-node.sh scripts/cpanel-autopull.sh
